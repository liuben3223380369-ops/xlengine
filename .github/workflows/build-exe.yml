name: 构建 Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-exe:
    name: 交叉编译 Windows 可执行程序
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 mingw-w64 交叉编译器
        run: |
          sudo apt-get update
          # 关键：Debian/Ubuntu 的 mingw-w64 只是元包，**不含 zlib 头文件**。
          # 少了 libz-mingw-w64-dev，编译 canvas.cpp / zip.cpp 时会报：
          #   zlib.h: No such file or directory
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            libz-mingw-w64-dev
          x86_64-w64-mingw32-g++ --version

      - name: 编译
        run: |
          # 用 bash 直接跑，不要 chmod +x ——
          # 改文件模式会让 git 记一个"未暂存改动"，后面 pull --rebase 就废了：
          #   error: cannot pull with rebase: You have unstaged changes
          # 直接重定向到文件（不用管道），保证日志一定落盘 —— CI 的运行日志
          # 在外部取不到，只能靠这个文件排查。
          set +e
          bash build_exe.sh > build-exe.log 2>&1
          rc=$?
          set -e
          echo "----- 日志尾部 -----"
          tail -80 build-exe.log || true
          echo "-------------------"
          exit $rc

      - name: 回传构建日志
        # CI 的运行日志在外部取不到（结果域名被拦），所以把日志推到独立分支
        # 再用 API 读回。两个工作流各用一个分支 —— 共用一个分支时，-f 会互相覆盖。
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          mkdir -p ci-logs
          cp build-exe.log ci-logs/build-exe.log || echo "日志缺失"
          ls -la ci-logs/ || true
          git add -f ci-logs/build-exe.log
          git commit -m "CI 日志: build-exe run ${{ github.run_id }}" || echo "无变化"
          git push -f origin HEAD:ci-logs-exe || echo "推送失败"


      - name: 查看产物
        run: |
          ls -la dist/
          file dist/xlengine.exe 2>/dev/null || true

      - name: 用 Wine 冒烟测试
        # Wine 本身可能抽风，但不该因此判构建失败
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends wine64 || true
          wine64 dist/xlengine.exe --test 2>&1 | tail -20 || true

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: xlengine-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      - name: 把成品推回仓库
        # Artifacts 有保存期限，也不是"打开仓库就能拿到"。所以把构建好的成品
        # 直接提交回仓库的 dist/ —— 克隆下来就有，不用再去 Actions 页面翻。
        #
        # 必须从远程 main 重新建分支：上一步"回传构建日志"已经在本地留下过
        # commit，在此基础上 pull --rebase 容易冲突。
        # commit message 带 [skip ci]，否则这次 push 会再次触发本工作流。
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          {
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git fetch origin main
          git checkout -B main origin/main
          ls -la dist/ || true
          git add -f dist/*.exe
          if git diff --cached --quiet; then echo "成品无变化，跳过"; exit 0; fi
          git commit -m "CI: 更新 Windows EXE [skip ci]"
          # 分支就是从 origin/main 建出来的，直接推即可（不要再 pull --rebase：
          # 它会因为工作区任何一点未暂存改动而拒绝工作）。
          # 两个工作流可能同时推，失败就重新对齐后再来一次。
          for i in 1 2 3; do
            git push origin main && break
            echo "第 $i 次推送失败，重新对齐后重试"
            git fetch origin main
            git reset --soft origin/main
            sleep 5
          done
          } 2>&1 | tee push.log

      - name: 回传推送日志
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          mkdir -p ci-logs
          cp push.log ci-logs/push.log 2>/dev/null || echo "无 push.log"
          git add -f ci-logs/push.log
          git commit -m "CI 日志: push run ${{ github.run_id }}" || echo "无变化"
          git push -f origin HEAD:ci-logs-exe || echo "推送失败"
