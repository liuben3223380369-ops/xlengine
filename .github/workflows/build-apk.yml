name: 构建 Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: 安装 Android SDK / NDK / CMake
        run: |
          # ubuntu-latest 预装 Android SDK，路径可能是 ANDROID_HOME 或 ANDROID_SDK_ROOT
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKMANAGER" || ls "$ANDROID_HOME/cmdline-tools/"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: 构建 Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 查看产物
        run: |
          ls -la android/app/build/outputs/apk/debug/
          ls -la android/app/build/intermediates/stripped_native_libs/debug/out/lib/*/ 2>/dev/null || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xlengine-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
