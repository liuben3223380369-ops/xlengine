name: 构建 Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: 安装 Android SDK / NDK / CMake
        run: |
          # ubuntu-latest 预装 Android SDK，路径可能是 ANDROID_HOME 或 ANDROID_SDK_ROOT
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKMANAGER" || ls "$ANDROID_HOME/cmdline-tools/"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: 构建 Debug APK
        working-directory: android
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > build-apk.log 2>&1
          rc=$?
          set -e
          echo "----- 日志尾部 -----"
          tail -80 build-apk.log || true
          echo "-------------------"
          exit $rc

      - name: 回传构建日志
        # CI 的运行日志在外部取不到（结果域名被拦），所以把日志推到独立分支
        # 再用 API 读回。两个工作流各用一个分支 —— 共用一个分支时，-f 会互相覆盖。
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          mkdir -p ci-logs
          cp android/build-apk.log ci-logs/build-apk.log || echo "日志缺失"
          ls -la ci-logs/ || true
          git add -f ci-logs/build-apk.log
          git commit -m "CI 日志: build-apk run ${{ github.run_id }}" || echo "无变化"
          git push -f origin HEAD:ci-logs-apk || echo "推送失败"


      - name: 查看产物
        run: |
          ls -la android/app/build/outputs/apk/debug/
          ls -la android/app/build/intermediates/stripped_native_libs/debug/out/lib/*/ 2>/dev/null || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xlengine-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true

      - name: 把成品推回仓库
        # Artifacts 有保存期限，也不是"打开仓库就能拿到"。所以把构建好的成品
        # 直接提交回仓库的 dist/ —— 克隆下来就有，不用再去 Actions 页面翻。
        #
        # 必须从远程 main 重新建分支：上一步"回传构建日志"已经在本地留下过
        # commit，在此基础上 pull --rebase 容易冲突。
        # commit message 带 [skip ci]，否则这次 push 会再次触发本工作流。
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git fetch origin main
          # 上一次 CI 已经把同名成品提交进 origin/main 了，而工作区里刚构建的
          # 那个是未跟踪文件 —— 直接 checkout 会被拒绝：
          #   error: The following untracked working tree files would be
          #          overwritten by checkout: dist/dist/xlengine.apk
          # 所以先把新成品挪走，checkout 完再放回来。
          mkdir -p /tmp/artifacts
          cp dist/xlengine.apk /tmp/artifacts/ 2>/dev/null || true
          rm -f dist/xlengine.apk
          git checkout -B main origin/main
          cp /tmp/artifacts/dist/xlengine.apk dist/ 2>/dev/null || true
          # 改个名再提交：app-debug.apk 是构建期命名，放到 dist/ 里看不出是什么
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/xlengine.apk
          ls -la dist/ || true
          git add -f dist/xlengine.apk
          if git diff --cached --quiet; then echo "成品无变化，跳过"; exit 0; fi
          # 与 EXE 同理：分支本就基于 origin/main，直接推，不用 pull --rebase。
          # 重试时必须重新 add + commit —— reset --soft 会撤掉 commit。
          for i in 1 2 3; do
            git add -f dist/xlengine.apk
            git commit -m "CI: 更新 Android APK [skip ci]" || echo "本次无新内容"
            git push origin main && break
            echo "第 $i 次推送失败，重新对齐后重试"
            git fetch origin main
            git reset --soft origin/main
            sleep 5
          done
