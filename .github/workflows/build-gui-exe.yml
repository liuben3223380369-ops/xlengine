name: 打包 Windows 桌面版（完整界面）

# 一个 job 在 Linux 上交叉编译引擎 DLL（mingw 在那边稳定），
# 另一个 job 在 Windows 真机上用 PyInstaller 把 Python + PySide6 + DLL
# 打成可执行程序。
#
# 为什么拆开：Windows runner 上装 mingw 不稳定（Chocolatey 源时常超时），
# 而 Linux 上的 mingw 交叉编译在 build-exe.yml 里已验证多年稳定。
# 各司其职，成功率最高。
#
# 产物体积大（PySide6 全量打包，约 100~200 MB），
# 但换来的是"双击就是 Excel 那样的完整界面"，这是刻意的取舍。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-dll:
    name: 交叉编译引擎 DLL
    runs-on: ubuntu-latest
    # 失败时要 git push 日志分支，没有它 GITHUB_TOKEN 只有读权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            mingw-w64 \
            libz-mingw-w64-dev
          x86_64-w64-mingw32-g++ --version

      - name: 编译 xlengine.dll
        id: makedll
        run: |
          chmod +x build_dll.sh
          bash build_dll.sh > build-dll.log 2>&1 && echo "OK" || { echo "失败"; cat build-dll.log; }
          tail -5 build-dll.log
          ls -la dist/xlengine.dll 2>/dev/null || exit 1

      # CI 的运行日志在外部取不到（结果域名被拦），artifact 下载域名同样被拦。
      # 所以失败时把日志推到独立分支，用 contents API 读回来。
      - name: 回传编译日志
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          mkdir -p ci-logs
          cp build-dll.log ci-logs/build-dll.log || echo "日志缺失"
          git add -f ci-logs/build-dll.log
          git commit -m "CI 日志: build-dll run ${{ github.run_id }}" || echo "无变化"
          git push -f origin HEAD:ci-logs-dll || echo "推送失败"

      - uses: actions/upload-artifact@v4
        with:
          name: xlengine-dll
          path: dist/xlengine.dll
          if-no-files-found: error

  package:
    name: 打包 Windows 可执行程序
    needs: build-dll
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.6.1 PyInstaller==6.3.0

      - name: 取回引擎 DLL
        uses: actions/download-artifact@v4
        with:
          name: xlengine-dll
          path: .

      - name: 检查 DLL
        shell: bash
        run: |
          ls -la xlengine.dll
          file xlengine.dll || true

      - name: PyInstaller 打包
        shell: bash
        run: |
          # --onedir 而不是 --onefile：
          #   这个程序带 PySide6 全量运行时，--onefile 每次启动都要先把
          #   上百 MB 解压到临时目录，开机那一下要等十几秒且容易误判成卡死。
          # --windowed：不要控制台黑窗口。
          # --add-data "gui;gui" ：Python 界面源码
          # --add-binary "xlengine.dll;." ：引擎（engine.py 会从 _MEIPASS 找它）
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "xlengine" \
            --add-data "gui;gui" \
            --add-binary "xlengine.dll;." \
            --hidden-import "PySide6.QtCore" \
            --hidden-import "PySide6.QtGui" \
            --hidden-import "PySide6.QtWidgets" \
            --exclude-module "tkinter" \
            --exclude-module "matplotlib" \
            --exclude-module "numpy" \
            --exclude-module "PIL" \
            --exclude-module "PySide6.QtQml" \
            --exclude-module "PySide6.QtQuick" \
            --exclude-module "PySide6.Qt3DCore" \
            --exclude-module "PySide6.QtMultimedia" \
            --exclude-module "PySide6.QtWebEngineCore" \
            --exclude-module "PySide6.QtWebEngineWidgets" \
            --exclude-module "PySide6.QtCharts" \
            --exclude-module "PySide6.QtDataVisualization" \
            gui/app.py > build-gui.log 2>&1 && tail -20 build-gui.log || { tail -40 build-gui.log; exit 1; }

      # PyInstaller 的输出很长，失败时看不到结尾没法定位。
      # 同样用推分支的办法把日志带出来（artifact 下载域名被拦）。
      - name: 回传打包日志
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          mkdir -p ci-logs
          cp build-gui.log ci-logs/build-gui.log 2>/dev/null || echo "见上方输出" > ci-logs/build-gui.log
          git add -f ci-logs/build-gui.log
          git commit -m "CI 日志: build-gui run ${{ github.run_id }}" || echo "无变化"
          git push -f origin HEAD:ci-logs-gui || echo "推送失败"

      # 只检查产物内容，不真跑程序。
      #
      # 真跑会挂住：GUI 程序在无显示环境下起 QApplication，即使设了
      # offscreen 平台插件也可能不退出，整个 job 就卡在那里几小时。
      # 而"能启动"这件事用户双击一下就知道，CI 上不值得为它冒卡死的风险。
      #
      # 这里验证的是真正可能出问题的地方：引擎 DLL 和 Qt 运行库有没有被
      # 打进去 —— 漏掉 DLL 的话程序一启动就报"找不到共享库"。
      - name: 检查产物内容
        shell: bash
        run: |
          ls -la dist/xlengine/xlengine.exe
          # PyInstaller 6.x 的 --onedir 把所有依赖放进 _internal/
          # （5.x 是平铺在 dist/xlengine/ 里）。两个位置都找，兼容两种版本。
          for d in dist/xlengine dist/xlengine/_internal; do
            if [ -f "$d/xlengine.dll" ]; then DLLDIR="$d"; break; fi
          done
          echo "-- 引擎 DLL --"
          ls -la "${DLLDIR:-未找到}/xlengine.dll" || {
            echo "!! 引擎 DLL 未被打包 —— 程序启动会报找不到共享库"; exit 1; }
          echo "-- Qt 运行库 --"
          ls "$DLLDIR" | grep -iE "Qt6Core|Qt6Gui|Qt6Widgets" | head -5
          echo "-- 界面源码 --"
          ls "$DLLDIR/gui/"*.py 2>/dev/null | head -6 \
            || echo "（未找到 gui 目录，检查 --add-data 是否生效）"
          echo "-- 总体积 --"
          du -sh dist/xlengine

      - name: 打压缩包
        shell: bash
        run: |
          cd dist
          7z a -tzip ../xlengine-windows.zip xlengine -xr'!*.pyc' || \
            powershell -Command "Compress-Archive -Path xlengine -DestinationPath ../xlengine-windows.zip"
          ls -la ../xlengine-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xlengine-windows
          path: xlengine-windows.zip
          if-no-files-found: error

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xlengine-windows.zip
          generate_release_notes: true

      - name: 把成品推回仓库
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git fetch origin main
          mkdir -p dist
          mkdir -p /tmp/art
          cp xlengine-windows.zip /tmp/art/ 2>/dev/null || true
          rm -f dist/xlengine-windows.zip
          git checkout -B main origin/main
          mkdir -p dist
          cp /tmp/art/xlengine-windows.zip dist/ 2>/dev/null || true
          git add -f dist/xlengine-windows.zip
          git commit -m "CI: 更新 Windows 桌面版 [skip ci]" || echo "无变化"
          git push origin main || echo "推送失败"
