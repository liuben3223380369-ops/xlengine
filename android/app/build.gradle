plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xlengine.app'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.xlengine.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // 只留 arm64-v8a：armeabi-v7a 与 x86_64 各要再编一份 .so，
        // 三架构的 debug 包有 53MB，塞进 git 仓库太占地方。
        // 需要覆盖别的架构时，在下面 splits 之外加 flavor 即可。
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-fexceptions', '-frtti'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
